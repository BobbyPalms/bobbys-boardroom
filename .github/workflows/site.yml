name: Site and data
# About every 5 minutes, back to back: refresh the data from the routes, track and grade every game the algo prices, rebuild the site
# and deploy it. Hosting: Cloudflare Pages behind Cloudflare Access (friends-only login) once the two Cloudflare
# secrets are set in the repo; until then, GitHub Pages (public).
# Live data ships with each deploy and is carried to the next run in the Actions cache (no commit). Long-term records
# (history, matches, ratings, officials, results) are committed once a day so they're safe in the repo.
on:
  push:
    branches: [main]
    paths: ["src/**", "functions/**", "index.html", "scripts/**", "package.json", ".github/workflows/site.yml"]
  schedule: [{ cron: "*/5 * * * *" }]   # backup only: GitHub runs these late or skips them; each run queues the next itself
  workflow_dispatch:
    inputs:
      backfill: { description: "Re-pull every past season / match from scratch", type: boolean, default: false }
permissions: { contents: write, pages: write, id-token: write, actions: write }
concurrency: { group: site, cancel-in-progress: false }
env:
  CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CF_PROJECT: bobbys-boardroom
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: { name: github-pages, url: "${{ steps.deploy.outputs.page_url }}" }
    steps:
      - run: echo "START=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - id: pages
        if: env.CF_TOKEN == ''
        uses: actions/configure-pages@v5
      - run: npm install --no-audit --no-fund
      - name: Restore the last run's data (cache)
        uses: actions/cache/restore@v4
        with: { path: .state, key: "state-${{ github.run_id }}", restore-keys: "state-" }
      - name: Carry over the last run's data
        continue-on-error: true
        run: node scripts/restore-state.mjs --dir .state/data "${{ steps.pages.outputs.base_url }}"
      - name: Update data from the routes
        run: node scripts/update-data.mjs ${{ inputs.backfill && '--backfill' || '' }}
      - name: Track results in the background (log today's board, grade finals, learn)
        continue-on-error: true
        run: node scripts/track.mjs
      - run: node scripts/build.mjs
      - name: Keep this run's data for the next run
        run: rm -rf .state && mkdir -p .state && cp -r data .state/data && rm -rf .state/data/games   # the archive travels by commit
      - uses: actions/cache/save@v4
        with: { path: .state, key: "state-${{ github.run_id }}" }

      # ---- hosting: GitHub Pages (public) until the Cloudflare secrets exist ----
      - if: env.CF_TOKEN == ''
        uses: actions/upload-pages-artifact@v3
        with: { path: dist }
      - id: deploy
        if: env.CF_TOKEN == ''
        uses: actions/deploy-pages@v4
      # ---- hosting: Cloudflare Pages, protected by Cloudflare Access ----
      - name: Create the Cloudflare Pages project (first run only)
        if: env.CF_TOKEN != ''
        continue-on-error: true
        env: { CLOUDFLARE_API_TOKEN: "${{ env.CF_TOKEN }}", CLOUDFLARE_ACCOUNT_ID: "${{ env.CF_ACCOUNT }}" }
        run: npx --yes wrangler@3 pages project create "$CF_PROJECT" --production-branch=main
      - name: Bet slips database (D1) for the /api functions
        if: env.CF_TOKEN != ''
        continue-on-error: true
        run: node scripts/setup-db.mjs
      - name: Encryption secret for the opt-in Kalshi sync keys (made once, kept in Cloudflare only)
        if: env.CF_TOKEN != ''
        continue-on-error: true
        env: { CLOUDFLARE_API_TOKEN: "${{ env.CF_TOKEN }}", CLOUDFLARE_ACCOUNT_ID: "${{ env.CF_ACCOUNT }}" }
        run: |
          # only when Cloudflare answers and has none yet: an existing secret is never replaced
          out=$(npx --yes wrangler@3 pages secret list --project-name="$CF_PROJECT" 2>&1) || exit 0
          echo "$out" | grep -q SYNC_SECRET && exit 0
          echo "$out" | grep -qi "secret" || exit 0
          openssl rand -base64 32 | tr -d '\n' | npx --yes wrangler@3 pages secret put SYNC_SECRET --project-name="$CF_PROJECT"
      - name: Deploy to Cloudflare Pages
        if: env.CF_TOKEN != ''
        env: { CLOUDFLARE_API_TOKEN: "${{ env.CF_TOKEN }}", CLOUDFLARE_ACCOUNT_ID: "${{ env.CF_ACCOUNT }}" }
        run: npx --yes wrangler@3 pages deploy dist --project-name="$CF_PROJECT" --branch=main --commit-dirty=true

      - name: Daily snapshot of the long-term data
        run: |
          today=$(date -u +%F); last=$(git log -1 --format=%cs -- data/ratings 2>/dev/null || true)
          git config user.name "boardroom-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # every finished game's archive is committed every run (it isn't carried in the Actions cache)
          git add data/games 2>/dev/null || true
          if [ "$last" != "$today" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            git add data/history data/officials data/matches data/ratings data/track data/results data/learned.json 2>/dev/null || true
          fi
          git diff --cached --quiet || (git commit -m "data snapshot $today [skip ci]" && git pull --rebase --autostash && git push)
      # Keep the data fresh without depending on GitHub's schedule: every run queues the next one, about five
      # minutes after it started (concurrency keeps one run at a time; a newer queued run replaces an older one).
      - name: Queue the next run
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          left=$(( 300 - ( $(date +%s) - START ) )); if [ $left -gt 0 ]; then sleep $left; fi
          gh api -X POST "repos/${{ github.repository }}/actions/workflows/site.yml/dispatches" -f ref=main
