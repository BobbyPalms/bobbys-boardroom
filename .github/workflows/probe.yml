name: Probe a source
# Manual only. Fetches the splits sources from a GitHub runner and pushes the raw pages to the 'probe' branch, to check
# a source's format; run with "cleanup" ticked to delete that branch again.
on:
  workflow_dispatch:
    inputs:
      cleanup: { description: "Delete the probe branch instead", type: boolean, default: false }
permissions: { contents: write }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - if: inputs.cleanup
        run: git push "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" --delete probe || true
      - if: ${{ !inputs.cleanup }}
        run: |
          mkdir out
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"
          get() { curl -sS -L -m 40 -A "$UA" -H "Accept-Language: en-US" -o "out/$1" -w "$1 %{http_code} %{size_download}\n" "$2" || echo "$1 failed"; }
          get ea_api.json "https://drop-api.ea.com/rating/ea-sports-fc?locale=en&limit=100&offset=0"
          get ea_api_team.json "https://drop-api.ea.com/rating/ea-sports-fc?locale=en&limit=100&offset=0&team=243"
          get ea_page.html "https://www.ea.com/games/ea-sports-fc/ratings"
          cd out && git init -q -b probe && git add -A
          git -c user.name=probe -c user.email=probe@users.noreply.github.com commit -q -m "probe $(date -u +%FT%TZ)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" probe
