name: Probe a source
# Manual only. Fetches sources from a GitHub runner and pushes the raw pages to the 'probe' branch, to check
# a source's format; run with "cleanup" ticked to delete that branch again.
on:
  workflow_dispatch:
    inputs:
      cleanup: { description: "Delete the probe branch instead", type: boolean, default: false }
      diag: { description: "Diagnose a matchup: SPORT|away|home (runs the site's engine and saves every input)", type: string, default: "" }
permissions: { contents: write }
jobs:
  probe:
    runs-on: ubuntu-latest
    env: { CF_TOKEN: "${{ secrets.CLOUDFLARE_API_TOKEN }}", CF_ACCOUNT: "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" }
    steps:
      - if: inputs.cleanup
        run: git push "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" --delete probe || true
      - if: ${{ inputs.diag != '' }}
        uses: actions/checkout@v4
      - if: ${{ inputs.diag != '' }}
        uses: actions/setup-node@v4
        with: { node-version: 20 }
      - if: ${{ inputs.diag != '' }}
        run: |
          npm install --no-audit --no-fund
          mkdir -p out && IFS='|' read -r SP AW HO <<< "${{ inputs.diag }}"
          node scripts/diag.mjs "$SP" "$AW" "$HO" > out/diag.json 2> out/diag.err || true
          cd out && git init -q -b probe && git add -A
          git -c user.name=probe -c user.email=probe@users.noreply.github.com commit -q -m "diag $(date -u +%FT%TZ)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" probe
      - if: ${{ !inputs.cleanup && inputs.diag == '' }}
        run: |
          mkdir out
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"
          get() { curl -sS -L -m 40 -A "$UA" -H "Accept-Language: en-US" -o "out/$1" -w "$1 %{http_code} %{size_download}\n" "$2" || echo "$1 failed"; }
          set +e; D=https://docs.kalshi.com
          for pg in api-reference/orders/create-order-v2 api-reference/orders/create-order api-reference/communications/create-rfq api-reference/communications/get-quotes api-reference/communications/get-rfq api-reference/communications/delete-rfq api-reference/multivariate/create-market-in-multivariate-event-collection api-reference/multivariate/get-multivariate-event-collection api-reference/portfolio/get-balance api-reference/orders/get-order api-reference/portfolio/get-fills getting_started/demo_env getting_started/rfqs getting_started/fee_rounding; do
            f=$(echo $pg | tr '/' '_'); curl -sS -L --compressed -m 40 -A "$UA" -o "out/doc_$f.md" -w "$pg %{http_code} %{size_download}\n" "$D/$pg.md" >> out/ids.txt
          done
          curl -sS -L --compressed -m 60 -A "$UA" -o out/openapi.yaml -w "openapi %{http_code} %{size_download}\n" "$D/openapi.yaml" >> out/ids.txt
          curl -sS -L --compressed -m 60 -A "$UA" -o out/llms.txt -w "llms %{http_code} %{size_download}\n" "$D/llms.txt" >> out/ids.txt
          cd out && git init -q -b probe && git add -A
          git -c user.name=probe -c user.email=probe@users.noreply.github.com commit -q -m "probe $(date -u +%FT%TZ)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" probe
