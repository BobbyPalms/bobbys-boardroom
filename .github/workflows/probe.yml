name: Probe a source
# Manual only. Fetches sources from a GitHub runner and pushes the raw pages to the 'probe' branch, to check
# a source's format; run with "cleanup" ticked to delete that branch again.
on:
  workflow_dispatch:
    inputs:
      cleanup: { description: "Delete the probe branch instead", type: boolean, default: false }
      diag: { description: "Diagnose a matchup: SPORT|away|home (runs the site's engine and saves every input)", type: string, default: "" }
permissions: { contents: write }
jobs:
  probe:
    runs-on: ubuntu-latest
    env: { CF_TOKEN: "${{ secrets.CLOUDFLARE_API_TOKEN }}", CF_ACCOUNT: "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" }
    steps:
      - if: inputs.cleanup
        run: git push "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" --delete probe || true
      - if: ${{ inputs.diag != '' }}
        uses: actions/checkout@v4
      - if: ${{ inputs.diag != '' }}
        uses: actions/setup-node@v4
        with: { node-version: 20 }
      - if: ${{ inputs.diag != '' }}
        run: |
          npm install --no-audit --no-fund
          mkdir -p out && IFS='|' read -r SP AW HO <<< "${{ inputs.diag }}"
          node scripts/diag.mjs "$SP" "$AW" "$HO" > out/diag.json 2> out/diag.err || true
          cd out && git init -q -b probe && git add -A
          git -c user.name=probe -c user.email=probe@users.noreply.github.com commit -q -m "diag $(date -u +%FT%TZ)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" probe
      - if: ${{ !inputs.cleanup && inputs.diag == '' }}
        run: |
          mkdir out
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"
          get() { curl -sS -L -m 40 -A "$UA" -H "Accept-Language: en-US" -o "out/$1" -w "$1 %{http_code} %{size_download}\n" "$2" || echo "$1 failed"; }
          set +e; K=https://api.elections.kalshi.com/trade-api/v2
          kget() { curl -sS --compressed -m 40 -A "$UA" -o "out/$1" -w "$1 %{http_code} %{size_download}\n" "$2" >> out/ids.txt; }
          kget k_series_sports.json "$K/series?category=Sports"
          kget k_mve.json "$K/multivariate_event_collections?status=open&limit=200"
          for s in KXNBAGAME KXNBASPREAD KXNBATOTAL KXNFLGAME KXNFLSPREAD KXNFLTOTAL KXNCAAFGAME KXNCAAMBGAME KXNHLGAME KXEPLGAME KXUCLGAME KXATPMATCH KXUFCFIGHT KXWNBAGAME KXMLBGAME KXNCAAWBGAME; do
            kget "k_ev_$s.json" "$K/events?series_ticker=$s&status=open&with_nested_markets=true&limit=200"
          done
          curl -sS -m 30 -o /dev/null -D out/k_cors.txt -X OPTIONS -H "Origin: https://bobbys-boardroom.pages.dev" -H "Access-Control-Request-Method: POST" -H "Access-Control-Request-Headers: kalshi-access-key,kalshi-access-signature,kalshi-access-timestamp,content-type" "$K/portfolio/orders"
          curl -sS -m 30 -o out/k_get_cors.json -D out/k_get_cors.txt -H "Origin: https://bobbys-boardroom.pages.dev" "$K/series?category=Sports&limit=1"
          cd out && git init -q -b probe && git add -A
          git -c user.name=probe -c user.email=probe@users.noreply.github.com commit -q -m "probe $(date -u +%FT%TZ)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" probe
