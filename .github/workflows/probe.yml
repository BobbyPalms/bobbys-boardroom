name: Probe a source
# Manual only. Fetches sources from a GitHub runner and pushes the raw pages to the 'probe' branch, to check
# a source's format; run with "cleanup" ticked to delete that branch again.
on:
  workflow_dispatch:
    inputs:
      cleanup: { description: "Delete the probe branch instead", type: boolean, default: false }
permissions: { contents: write }
jobs:
  probe:
    runs-on: ubuntu-latest
    env: { CF_TOKEN: "${{ secrets.CLOUDFLARE_API_TOKEN }}", CF_ACCOUNT: "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" }
    steps:
      - if: inputs.cleanup
        run: git push "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" --delete probe || true
      - if: ${{ !inputs.cleanup }}
        run: |
          mkdir out
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"
          get() { curl -sS -L -m 40 -A "$UA" -H "Accept-Language: en-US" -o "out/$1" -w "$1 %{http_code} %{size_download}\n" "$2" || echo "$1 failed"; }
          Y=$(TZ=America/New_York date -d "-1 day" +%Y%m%d); B=https://site.api.espn.com/apis/site/v2/sports
          for sl in basketball/nba football/nfl hockey/nhl soccer/uefa.champions soccer/eng.1 basketball/mens-college-basketball football/college-football baseball/mlb tennis/atp mma/ufc basketball/wnba; do
            f=$(echo $sl | tr '/.' '__')
            curl -sS --compressed -m 40 -A "$UA" "$B/$sl/scoreboard?dates=$Y" -o sb.json || true
            id=$(jq -r '[.events[]? | select(.status.type.completed==true or .competitions[0].status.type.completed==true) | .id] | first // empty' sb.json)
            [ -z "$id" ] && id=$(jq -r '[.events[]?.id] | first // empty' sb.json)
            [ -z "$id" ] && { curl -sS --compressed -m 40 -A "$UA" "$B/$sl/scoreboard" -o sb.json; id=$(jq -r '[.events[]? | select(.status.type.completed==true) | .id] | first // ([.events[]?.id] | first) // empty' sb.json); }
            echo "$sl $id" >> out/ids.txt
            [ -n "$id" ] && curl -sS --compressed -m 40 -A "$UA" "$B/$sl/summary?event=$id" -o "out/sum_$f.json" -w "$sl %{http_code} %{size_download}\n" >> out/ids.txt
            cp sb.json "out/sb_$f.json"
          done
          cd out && git init -q -b probe && git add -A
          git -c user.name=probe -c user.email=probe@users.noreply.github.com commit -q -m "probe $(date -u +%FT%TZ)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" probe
